<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iron Tracker — Oilfield Inventory</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --bg2: #181c27;
      --bg3: #1e2333;
      --border: rgba(255,255,255,0.08);
      --border2: rgba(255,255,255,0.14);
      --accent: #f0a500;
      --accent2: #e07b00;
      --text: #e8eaf0;
      --text2: #8b92a8;
      --text3: #555d72;
      --success: #2ecc71;
      --danger: #e74c3c;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Barlow', sans-serif;
      --display: 'Barlow Condensed', sans-serif;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
      line-height: 1.6;
    }

    /* Header */
    header {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      height: 64px;
    }

    .logo {
      font-family: var(--display);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .logo span {
      color: var(--text2);
      font-weight: 600;
    }

    .header-badge {
      background: rgba(240,165,0,0.12);
      color: var(--accent);
      border: 1px solid rgba(240,165,0,0.25);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 4px;
    }

    /* Layout */
    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      min-height: calc(100vh - 64px);
    }

    /* Sidebar */
    .sidebar {
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .stab {
      flex: 1;
      padding: 14px 16px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text3);
      background: none;
      border: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }

    .stab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: rgba(240,165,0,0.04);
    }

    .stab:hover:not(.active) { color: var(--text2); background: rgba(255,255,255,0.03); }

    .sidebar-panel { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .sidebar-panel.active { display: flex; }

    /* Scan panel */
    .scan-panel { padding: 1.25rem; display: flex; flex-direction: column; gap: 1rem; flex: 1; }

    .field-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 6px;
    }

    textarea {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.7;
      padding: 12px;
      resize: vertical;
      min-height: 200px;
      transition: border 0.15s;
    }

    textarea:focus { outline: none; border-color: var(--accent); }
    textarea::placeholder { color: var(--text3); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.03em;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
    }
    .btn-primary:hover { background: var(--accent2); }
    .btn-primary:active { transform: scale(0.98); }

    .btn-ghost {
      background: transparent;
      color: var(--text2);
      border: 1px solid var(--border2);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.05); color: var(--text); }

    .btn-success {
      background: rgba(46,204,113,0.15);
      color: var(--success);
      border: 1px solid rgba(46,204,113,0.3);
    }
    .btn-success:hover { background: rgba(46,204,113,0.25); }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

    /* Definitions panel */
    .defs-panel { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

    .defs-add { padding: 1.25rem; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }

    .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    input[type="text"] {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 13px;
      padding: 9px 12px;
      transition: border 0.15s;
    }
    input[type="text"]:focus { outline: none; border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--text3); }

    .defs-list { flex: 1; overflow-y: auto; }

    .def-item {
      display: grid;
      grid-template-columns: 1fr 1.4fr auto;
      gap: 8px;
      align-items: center;
      padding: 9px 1.25rem;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .def-item:hover { background: rgba(255,255,255,0.02); }

    .def-serial { font-family: var(--mono); font-size: 11px; color: var(--accent); }
    .def-name { font-size: 13px; color: var(--text2); }

    .btn-del {
      background: none;
      border: none;
      color: var(--text3);
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      padding: 2px 6px;
      border-radius: 4px;
      transition: all 0.1s;
    }
    .btn-del:hover { color: var(--danger); background: rgba(231,76,60,0.1); }

    .defs-empty {
      padding: 2rem;
      text-align: center;
      color: var(--text3);
      font-size: 13px;
    }

    .defs-footer {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    /* Main results area */
    .main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .results-header {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg2);
    }

    .results-title {
      font-family: var(--display);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text2);
    }

    .results-body {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 300px;
      gap: 12px;
      color: var(--text3);
    }

    .empty-icon {
      font-size: 48px;
      opacity: 0.3;
    }

    .empty-state p { font-size: 14px; }

    /* Stats */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 6px;
    }

    .stat-val {
      font-family: var(--display);
      font-size: 32px;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
    }

    /* Tables */
    .result-section { margin-bottom: 2rem; }

    .section-heading {
      font-family: var(--display);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text3);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    table { width: 100%; border-collapse: collapse; }

    th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text3);
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      color: var(--text);
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .td-count {
      text-align: right;
      font-family: var(--display);
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }

    .td-mono {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent);
    }

    .result-table-wrap {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--success);
      color: #000;
      font-weight: 600;
      font-size: 13px;
      padding: 12px 20px;
      border-radius: 8px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    /* Responsive */
    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid var(--border); }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">Iron<span>Track</span></div>
  <div class="header-badge">MCE Inventory</div>
</header>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-tabs">
      <button class="stab active" onclick="showSideTab('scan')">Scan Assets</button>
      <button class="stab" onclick="showSideTab('defs')">Definitions</button>
    </div>

    <!-- Scan Panel -->
    <div class="sidebar-panel active" id="panel-scan">
      <div class="scan-panel">
        <div>
          <div class="field-label">Paste asset / serial numbers</div>
          <textarea id="serialInput" placeholder="C15120-0001&#10;MCE_IPRV_054&#10;MCE_IBOSS_070&#10;FRCP-0071&#10;MCE-LPMS-0003&#10;..."></textarea>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" onclick="processSerials()">&#9654; Identify Assets</button>
          <button class="btn btn-ghost" onclick="clearAll()">Clear</button>
        </div>
      </div>
    </div>

    <!-- Definitions Panel -->
    <div class="sidebar-panel" id="panel-defs">
      <div class="defs-panel">
        <div class="defs-add">
          <div class="field-label">Add new serial definition</div>
          <div class="input-row">
            <input type="text" id="newSerial" placeholder="Prefix e.g. C15120" />
            <input type="text" id="newName" placeholder="Description" />
          </div>
          <button class="btn btn-primary" onclick="addDefinition()" style="align-self:flex-start;">+ Add</button>
        </div>
        <div class="defs-list" id="defList"></div>
        <div class="defs-footer">
          <button class="btn btn-ghost" onclick="exportDefs()" style="font-size:12px;">Export JSON</button>
          <button class="btn btn-ghost" onclick="document.getElementById('importFile').click()" style="font-size:12px;">Import JSON</button>
          <input type="file" id="importFile" style="display:none;" accept=".json" onchange="importDefs(event)" />
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Results -->
  <main class="main">
    <div class="results-header">
      <div class="results-title">Inventory Out on Rent</div>
      <div id="copyBtns" style="display:none;gap:8px;align-items:center;flex-wrap:wrap;">
        <button class="btn btn-success" onclick="copyEmail()">&#9993; Copy for Email</button>
        <button class="btn btn-ghost" onclick="copyClipboard()">&#128203; Copy to Clipboard</button>
        <span id="copyFeedback" style="font-size:13px;color:var(--success);opacity:0;transition:opacity 0.3s;">Copied!</span>
      </div>
    </div>
    <div class="results-body" id="resultsBody">
      <div class="empty-state">
        <div class="empty-icon">&#9883;</div>
        <p>Paste your asset numbers on the left and hit <strong>Identify Assets</strong></p>
      </div>
    </div>
  </main>

</div>

<div class="toast" id="toast">Copied to clipboard!</div>

<script>
const PRESET = {
  "C15120": "10' Spool",
  "C1596": "8' Spool",
  "C1572": "6' Spool",
  "C1560": "5' Spool",
  "C1548": "4' Spool",
  "C1536": "3' Spool",
  "C1524": "2' Spool",
  "C1516": "16\" Spool",
  "C1512": "1' Spool",
  "SBT777-15": "7' T Block",
  "SBC7777-15": "7\" Cross Block",
  "SBC7474-15": "7x4 Block",
  "SBC7373-15": "7x3 Block",
  "AF73T-15": "7\"x3\" Flange",
  "AF33T-15": "3\"x3\" Flange",
  "AF43T-15": "4\"x3\" Flange",
  "AF33D-15": "3\" D-Hub Flange",
  "G15-BF": "3\" Blind Flange",
  "C15-BF": "7\" Blind Flange",
  "G2": "Gen 2 Stand",
  "G1": "Gen 1 Stand"
};

let definitions = {};
let lastResults = null;

function loadDefs() {
  try {
    const saved = localStorage.getItem('irontrack_defs_v1');
    if (saved) {
      definitions = JSON.parse(saved);
    } else {
      definitions = { ...PRESET };
      saveDefs();
    }
  } catch(e) {
    definitions = { ...PRESET };
  }
}

function saveDefs() {
  try { localStorage.setItem('irontrack_defs_v1', JSON.stringify(definitions)); } catch(e) {}
}

function showSideTab(tab) {
  document.querySelectorAll('.sidebar-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.stab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + tab).classList.add('active');
  event.target.classList.add('active');
  if (tab === 'defs') renderDefList();
}

function isMCESpecial(t) {
  const u = t.toUpperCase();
  return u.startsWith('MCE_IPRV_') || u.startsWith('MCE_IBOSS_');
}

function parseMCE(t) {
  const m = t.toUpperCase().match(/^MCE_(IPRV|IBOSS)_(\d+)$/);
  return m ? `${m[1]} ${m[2]}` : null;
}

function isLPMS(t) { return t.toUpperCase().startsWith('MCE-LPMS-'); }

function isFRCP(t) { return t.toUpperCase().startsWith('FRCP-'); }

function parseFRCP(t) {
  const m = t.toUpperCase().match(/^FRCP-(\d+)$/);
  return m ? `FRCP ${m[1]}` : null;
}

function lookupSerial(token) {
  const norm = token.trim().toUpperCase();
  const keys = Object.keys(definitions).sort((a, b) => b.length - a.length);
  for (const k of keys) {
    if (norm.startsWith(k.toUpperCase())) return definitions[k];
  }
  return null;
}

function processSerials() {
  const raw = document.getElementById('serialInput').value;
  if (!raw.trim()) return;

  // Deduplicate first
  const allTokens = raw.split(/[\n,\s]+/).map(s => s.trim()).filter(Boolean);
  const seen = new Set();
  const tokens = [];
  for (const t of allTokens) {
    const key = t.toUpperCase();
    if (!seen.has(key)) { seen.add(key); tokens.push(t); }
  }

  const counts = {};
  const mceSet = new Set();
  const frcpSet = new Set();
  const lpmsSet = new Set();
  let skipped = 0;

  for (const t of tokens) {
    if (isMCESpecial(t)) { const l = parseMCE(t); if (l) mceSet.add(l); continue; }
    if (isLPMS(t)) { lpmsSet.add(t.toUpperCase()); continue; }
    if (isFRCP(t)) { const l = parseFRCP(t); if (l) frcpSet.add(l); continue; }
    const name = lookupSerial(t);
    if (name) { counts[name] = (counts[name] || 0) + 1; }
    else { skipped++; }
  }

  if (lpmsSet.size > 0) counts["LPM Piece"] = lpmsSet.size;

  const mceItems = Array.from(mceSet).sort();
  const frcpItems = Array.from(frcpSet).sort();
  const knownCount = Object.values(counts).reduce((a, b) => a + b, 0);
  const total = tokens.length;
  const types = Object.keys(counts).length;

  lastResults = { counts, mceItems, frcpItems, total, knownCount, types, skipped };
  renderResults(lastResults);
  const cb = document.getElementById('copyBtns');
  cb.style.display = 'flex';
}

function renderResults({ counts, mceItems, frcpItems, total, knownCount, types, skipped }) {
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

  let html = `
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-label">Total scanned</div><div class="stat-val">${total}</div></div>
      <div class="stat-card"><div class="stat-label">Identified</div><div class="stat-val">${knownCount + mceItems.length + frcpItems.length}</div></div>
      <div class="stat-card"><div class="stat-label">Piece types</div><div class="stat-val">${types}</div></div>
      <div class="stat-card"><div class="stat-label">Skipped</div><div class="stat-val">${skipped}</div></div>
    </div>
  `;

  if (sorted.length > 0) {
    html += `<div class="result-section">
      <div class="section-heading">Inventory out on rent</div>
      <div class="result-table-wrap">
        <table>
          <thead><tr><th>Piece / Description</th><th style="text-align:right;">Count</th></tr></thead>
          <tbody>
            ${sorted.map(([name, qty]) => `
              <tr><td>${name}</td><td class="td-count">${qty}</td></tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }

  if (mceItems.length > 0) {
    html += `<div class="result-section">
      <div class="section-heading">IPRV / IBOSS Units</div>
      <div class="result-table-wrap">
        <table>
          <thead><tr><th>Unit</th></tr></thead>
          <tbody>
            ${mceItems.map(i => `<tr><td class="td-mono">${i}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }

  if (frcpItems.length > 0) {
    html += `<div class="result-section">
      <div class="section-heading">FRCP Units</div>
      <div class="result-table-wrap">
        <table>
          <thead><tr><th>Unit</th></tr></thead>
          <tbody>
            ${frcpItems.map(i => `<tr><td class="td-mono">${i}</td></tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
  }

  document.getElementById('resultsBody').innerHTML = html;
}

function buildEmailText() {
  if (!lastResults) return '';
  const { counts, mceItems, frcpItems } = lastResults;
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const lines = [];

  lines.push('INVENTORY OUT ON RENT');
  lines.push('─────────────────────────────');
  sorted.forEach(([name, qty]) => {
    lines.push(`${name.padEnd(30)} x${qty}`);
  });

  if (mceItems.length > 0) {
    lines.push('');
    lines.push('IPRV / IBOSS UNITS');
    lines.push('─────────────────────────────');
    mceItems.forEach(i => lines.push(i));
  }

  if (frcpItems.length > 0) {
    lines.push('');
    lines.push('FRCP UNITS');
    lines.push('─────────────────────────────');
    frcpItems.forEach(i => lines.push(i));
  }

  return lines.join('\n');
}

function buildClipboardText() {
  if (!lastResults) return '';
  const { counts, mceItems, frcpItems } = lastResults;
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  const lines = [];
  sorted.forEach(([name, qty]) => lines.push(`${name} x${qty}`));
  mceItems.forEach(i => lines.push(i));
  frcpItems.forEach(i => lines.push(i));
  return lines.join('\n');
}

function showFeedback() {
  const fb = document.getElementById('copyFeedback');
  if (fb) { fb.style.opacity = '1'; setTimeout(() => fb.style.opacity = '0', 2000); }
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

function copyEmail() {
  navigator.clipboard.writeText(buildEmailText()).then(showFeedback);
}

function copyClipboard() {
  navigator.clipboard.writeText(buildClipboardText()).then(showFeedback);
}

function clearAll() {
  document.getElementById('serialInput').value = '';
  document.getElementById('resultsBody').innerHTML = `
    <div class="empty-state">
      <div class="empty-icon">&#9883;</div>
      <p>Paste your asset numbers on the left and hit <strong>Identify Assets</strong></p>
    </div>`;
  document.getElementById('copyBtn').style.display = 'none';
  lastResults = null;
}

function addDefinition() {
  const serial = document.getElementById('newSerial').value.trim().toUpperCase();
  const name = document.getElementById('newName').value.trim();
  if (!serial || !name) return;
  definitions[serial] = name;
  saveDefs();
  document.getElementById('newSerial').value = '';
  document.getElementById('newName').value = '';
  renderDefList();
}

function deleteDefinition(serial) {
  delete definitions[serial];
  saveDefs();
  renderDefList();
}

function renderDefList() {
  const keys = Object.keys(definitions).sort();
  const el = document.getElementById('defList');
  if (keys.length === 0) {
    el.innerHTML = '<div class="defs-empty">No definitions yet</div>';
    return;
  }
  el.innerHTML = keys.map(k => `
    <div class="def-item">
      <span class="def-serial">${k}</span>
      <span class="def-name">${definitions[k]}</span>
      <button class="btn-del" onclick="deleteDefinition('${k}')" title="Remove">&#215;</button>
    </div>
  `).join('');
}

function exportDefs() {
  const blob = new Blob([JSON.stringify(definitions, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'irontrack_definitions.json'; a.click();
}

function importDefs(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      Object.assign(definitions, data);
      saveDefs(); renderDefList();
    } catch { alert('Could not read file.'); }
  };
  reader.readAsText(file);
}

loadDefs();
renderDefList();
</script>
</body>
</html>
